<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX ADMIN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes matrix-rain {
            0% { transform: translateY(-100%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        @keyframes glow { 0%, 100% { text-shadow: 0 0 5px #00ff00; } 50% { text-shadow: 0 0 20px #00ff00; } }

        body { background: #000000; color: #00ff00; font-family: 'Courier New', monospace; min-height: 100vh; padding: 20px; }
        .matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000; z-index: -2; }
        .matrix-char { position: absolute; color: #00ff00; opacity: 0.1; animation: matrix-rain 15s linear infinite; pointer-events: none; }
        .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
        .header { text-align: center; margin-bottom: 30px; padding: 30px 0; border-bottom: 2px solid #00ff00; }
        .header h1 { font-size: 32px; color: #00ff00; text-shadow: 0 0 10px #00ff00; letter-spacing: 3px; animation: glow 3s infinite; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }
        .panel { background: linear-gradient(135deg, rgba(0, 30, 0, 0.8), rgba(0, 50, 0, 0.6)); border: 2px solid #00ff00; border-radius: 5px; padding: 25px; box-shadow: 0 0 20px rgba(0, 255, 0, 0.3); }
        .panel h2 { font-size: 14px; color: #00ff00; text-shadow: 0 0 10px #00ff00; letter-spacing: 2px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px dashed #00aa00; }
        .panel-wide { grid-column: 1 / -1; }
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #00ff00; font-size: 11px; margin-bottom: 6px; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; background: rgba(0, 20, 0, 0.9); border: 1px solid #00ff00; color: #00ff00; font-family: 'Courier New', monospace; font-size: 12px; border-radius: 3px; }
        input:focus, select:focus { outline: none; box-shadow: 0 0 10px rgba(0, 255, 0, 0.5); }
        button { width: 100%; padding: 10px; background: rgba(0, 255, 0, 0.1); border: 1px solid #00ff00; color: #00ff00; font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.3s; letter-spacing: 1px; text-transform: uppercase; border-radius: 3px; margin-bottom: 10px; }
        button:hover { box-shadow: 0 0 15px rgba(0, 255, 0, 0.7); }
        .users-list { max-height: 400px; overflow-y: auto; }
        .user-card { background: rgba(0, 50, 0, 0.5); border: 1px solid rgba(0, 255, 0, 0.3); padding: 12px; border-radius: 3px; margin-bottom: 10px; font-size: 11px; }
        .user-name { font-weight: bold; color: #00ff00; margin-bottom: 4px; }
        .user-balance { color: #00aa00; margin-bottom: 8px; }
        .user-actions { display: flex; gap: 8px; }
        .user-actions button { flex: 1; padding: 6px; font-size: 10px; margin: 0; }
        .footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px dashed #00aa00; }
        .back-link { display: inline-block; margin: 0 5px; padding: 10px 20px; background: rgba(0, 255, 0, 0.1); border: 1px solid #00ff00; color: #00ff00; text-decoration: none; border-radius: 3px; font-size: 12px; text-transform: uppercase; transition: all 0.3s; cursor: pointer; }
        .back-link:hover { box-shadow: 0 0 15px rgba(0, 255, 0, 0.7); }
        .logout-link { background: rgba(255, 0, 0, 0.2) !important; border-color: #ff4444 !important; color: #ff4444 !important; }
        .message { padding: 12px; border-radius: 3px; margin-bottom: 15px; font-size: 11px; border-left: 3px solid; }
        .success { background: rgba(0, 255, 0, 0.1); color: #00ff00; border-left-color: #00ff00; }
        .error { background: rgba(255, 0, 0, 0.1); color: #ff4444; border-left-color: #ff4444; }
    </style>
</head>
<body>
    <div class="matrix-bg" id="matrixBg"></div>

    <div class="container">
        <div class="header">
            <h1>> ADMIN PANEL</h1>
            <p style="font-size: 11px; color: #00aa00; letter-spacing: 1px; text-transform: uppercase;">Gestión de Usuarios y Recargas</p>
        </div>

        <div class="dashboard">
            <!-- LISTA DE USUARIOS -->
            <div class="panel panel-wide">
                <h2>> USUARIOS DEL SISTEMA</h2>
                <div id="adminMessage"></div>
                <div class="users-list" id="usersList"></div>
            </div>

            <!-- RECARGAR SALDO -->
            <div class="panel">
                <h2>> RECARGAR SALDO</h2>
                <div id="rechargeMessage"></div>

                <div class="form-group">
                    <label for="selectUser">Selecciona Usuario:</label>
                    <select id="selectUser">
                        <option value="">-- Selecciona un usuario --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="rechargeAmount">Monto USDT:</label>
                    <input type="number" id="rechargeAmount" placeholder="Ej: 100" min="1">
                </div>

                <button onclick="rechargeUser()">> RECARGAR</button>
            </div>

            <!-- CREAR NUEVO USUARIO -->
            <div class="panel">
                <h2>> CREAR USUARIO</h2>

                <div class="form-group">
                    <label for="newUsername">Usuario:</label>
                    <input type="text" id="newUsername" placeholder="user1a2b">
                </div>

                <div class="form-group">
                    <label for="newPassword">Contraseña (4 dígitos):</label>
                    <input type="text" id="newPassword" placeholder="1234" maxlength="4">
                </div>

                <button onclick="createNewUser()">> CREAR</button>
            </div>
        </div>

        <div class="footer">
            <a href="inicio.html" class="back-link">> VOLVER</a>
            <a href="login.html" class="back-link logout-link">> CERRAR SESIÓN</a>
        </div>
    </div>

    <script>
        const DB_KEY = 'matrix_login_db';

        function getDB() {
            return JSON.parse(localStorage.getItem(DB_KEY)) || { users: [] };
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            renderUsersList();
            renderSelectUsers();
        }

        function initDB() {
            if (!localStorage.getItem(DB_KEY)) {
                const defaultDB = {
                    users: [
                        { username: 'user1a2b', password: '1234', balance: 0 },
                        { username: 'user2c3d', password: '5678', balance: 0 },
                        { username: 'user3e4f', password: '9012', balance: 0 },
                        { username: 'user4g5h', password: '3456', balance: 0 },
                        { username: 'user5i6j', password: '7890', balance: 0 },
                        { username: 'user6k7l', password: '1111', balance: 0 },
                        { username: 'user7m8n', password: '2222', balance: 0 },
                        { username: 'user8o9p', password: '3333', balance: 0 },
                        { username: 'user9q0r', password: '4444', balance: 0 },
                        { username: 'usera1s2', password: '5555', balance: 0 },
                        { username: 'userb3t4', password: '6666', balance: 0 },
                        { username: 'userc5u6', password: '7777', balance: 0 },
                        { username: 'userd7v8', password: '8888', balance: 0 },
                        { username: 'usere9w0', password: '9999', balance: 0 },
                        { username: 'userf1x2', password: '0000', balance: 0 },
                        { username: 'userg3y4', password: '1357', balance: 0 },
                        { username: 'userh5z6', password: '2468', balance: 0 },
                        { username: 'useri7a8', password: '5050', balance: 0 }
                    ]
                };
                localStorage.setItem(DB_KEY, JSON.stringify(defaultDB));
            }
        }

        function renderUsersList() {
            const db = getDB();
            const list = document.getElementById('usersList');
            
            if (!db.users || db.users.length === 0) {
                list.innerHTML = '<div style="color: #006600; text-align: center; padding: 20px;">[SIN USUARIOS]</div>';
                return;
            }

            list.innerHTML = db.users.map(user => `
                <div class="user-card">
                    <div class="user-name">👤 ${user.username}</div>
                    <div class="user-balance">💰 Saldo: ${(user.balance || 0).toFixed(2)} USDT | 🔐 Pass: ${user.password}</div>
                    <div class="user-actions">
                        <button onclick="deleteUser('${user.username}')" style="background: rgba(255, 0, 0, 0.2); border-color: #ff4444; color: #ff4444;">>> ELIMINAR</button>
                    </div>
                </div>
            `).join('');
        }

        function renderSelectUsers() {
            const db = getDB();
            const select = document.getElementById('selectUser');
            select.innerHTML = '<option value="">-- Selecciona un usuario --</option>' + 
                (db.users || []).map(user => `<option value="${user.username}">${user.username} (${(user.balance || 0).toFixed(2)} USDT)</option>`).join('');
        }

        function rechargeUser() {
            const username = document.getElementById('selectUser').value;
            const amount = parseFloat(document.getElementById('rechargeAmount').value);

            if (!username) {
                showMessage('rechargeMessage', '❌ Selecciona un usuario', 'error');
                return;
            }

            if (!amount || amount <= 0) {
                showMessage('rechargeMessage', '❌ Ingresa un monto válido', 'error');
                return;
            }

            const db = getDB();
            const user = db.users.find(u => u.username === username);

            if (user) {
                user.balance = (user.balance || 0) + amount;
                saveDB(db);
                showMessage('rechargeMessage', `✅ ${amount} USDT agregados a ${username}`, 'success');
                document.getElementById('rechargeAmount').value = '';
                document.getElementById('selectUser').value = '';
            }
        }

        function deleteUser(username) {
            if (!confirm(`¿Eliminar usuario "${username}"?`)) return;

            const db = getDB();
            db.users = db.users.filter(u => u.username !== username);
            saveDB(db);
            showMessage('adminMessage', `✅ Usuario "${username}" eliminado`, 'success');
        }

        function createNewUser() {
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value.trim();

            if (!username || !password) {
                showMessage('adminMessage', '❌ Completa todos los campos', 'error');
                return;
            }

            if (!/^\d{4}$/.test(password)) {
                showMessage('adminMessage', '❌ La contraseña debe ser 4 dígitos', 'error');
                return;
            }

            const db = getDB();
            if (db.users.find(u => u.username === username)) {
                showMessage('adminMessage', '❌ Este usuario ya existe', 'error');
                return;
            }

            db.users.push({ username, password, balance: 0 });
            saveDB(db);
            showMessage('adminMessage', `✅ Usuario "${username}" creado`, 'success');
            document.getElementById('newUsername').value = '';
            document.getElementById('newPassword').value = '';
        }

        function showMessage(elementId, text, type) {
            const element = document.getElementById(elementId);
            element.className = `message ${type}`;
            element.textContent = text;
            setTimeout(() => {
                element.textContent = '';
                element.className = '';
            }, 4000);
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }

        function createMatrixRain() {
            const bg = document.getElementById('matrixBg');
            const chars = '01アイウエオ';
            for (let i = 0; i < 30; i++) {
                const char = document.createElement('div');
                char.className = 'matrix-char';
                char.textContent = chars[Math.floor(Math.random() * chars.length)];
                char.style.left = Math.random() * window.innerWidth + 'px';
                char.style.animation = `matrix-rain ${5 + Math.random() * 10}s linear infinite`;
                bg.appendChild(char);
            }
        }

        initDB();
        createMatrixRain();
        renderUsersList();
        renderSelectUsers();
    </script>
</body>
</html>
